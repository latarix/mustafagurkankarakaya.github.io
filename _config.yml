title: Mustafa Gürkan Karakaya
description: ""
lang: tr-TR
timezone: Europe/Istanbul

url: "https://mustafagurkankarakaya.com"
baseurl: ""

author:
  name: Mustafa Gürkan Karakaya
  url: "https://mustafagurkankarakaya.com"

# Header'daki bağlantılar. Boş bıraktığın satır görünmez.
social:
  github: KULLANICI_ADI
  linkedin: PROFIL
  email: mail@mustafagurkankarakaya.com

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /posts/:title/
  - scope:
      path: ""
      type: pages
    values:
      layout: page

exclude:
  - README.md
  - LICENSE
  - tools
  - "*.gemspec"
